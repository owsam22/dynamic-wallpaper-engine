<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallpaper - Dynamic Wave Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-overlay {
            position: absolute;
            bottom: 40px;
            right: 50px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .hud-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulse 2s infinite ease-in-out;
        }

        .clock {
            font-size: 26px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="hud-overlay">
        <div class="clock" id="clockDisplay">--:--:--</div>
        <div class="hud-badge">
            <span class="hud-dot"></span>
            <span>AC Live Engine Active</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clockDisplay = document.getElementById('clockDisplay');

        let width = 0;
        let height = 0;
        let particles = [];
        const particleCount = 75;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: Math.random() * 2.5 + 1,
                    hue: 180 + Math.random() * 60,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = `${hrs}:${mins}:${secs}`;
        }

        function drawGradientBackground() {
            const grad = ctx.createRadialGradient(
                width * 0.5, height * 0.4, 50,
                width * 0.5, height * 0.5, Math.max(width, height) * 0.8
            );
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(0.5, '#090d16');
            grad.addColorStop(1, '#020408');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawWave(amplitude, frequency, speed, color, offsetY) {
            ctx.beginPath();
            ctx.moveTo(0, height * offsetY);
            for (let x = 0; x <= width; x += 10) {
                const y = Math.sin(x * frequency + time * speed) * amplitude +
                          Math.cos(x * frequency * 0.5 + time * (speed * 0.7)) * (amplitude * 0.5);
                ctx.lineTo(x, height * offsetY + y);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function render() {
            time += 0.015;
            drawGradientBackground();

            // Draw glowing cosmic wave ribbons
            drawWave(45, 0.003, 0.8, 'rgba(0, 240, 255, 0.25)', 0.65);
            drawWave(35, 0.004, 1.1, 'rgba(138, 43, 226, 0.25)', 0.68);
            drawWave(60, 0.002, 0.5, 'rgba(0, 180, 255, 0.15)', 0.72);

            // Update & draw particles
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.alpha})`;
                ctx.fill();

                // Connect nearby particles
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        const lineAlpha = (1 - dist / 130) * 0.18;
                        ctx.strokeStyle = `rgba(0, 240, 255, ${lineAlpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        setInterval(updateClock, 1000);
        updateClock();
        render();
    </script>
</body>
</html>
